name: sandbox-probe

# Phase 1 experiment: create a REAL GitHub Codespace from this repository and
# measure the container environment that Chrome would actually run in.
#
# This workflow is the only place where the Codespaces platform is exercised.
# It runs entirely on GitHub-hosted runners; no local Docker and no local
# tooling are required.
#
# The probe invokes the installed binaries directly (Xtigervnc, google-chrome,
# tigervncpasswd). It is a measurement harness, not runtime architecture.

on:
  workflow_dispatch:
    inputs:
      machine:
        description: Codespaces machine type
        type: choice
        default: basicLinux32gb
        options:
          - basicLinux32gb
          - standardLinux32gb

# NOTE: "codespaces" is NOT a valid GITHUB_TOKEN permission scope, so it cannot
# be requested here, and the default token is not expected to be able to create
# a Codespace. To use this workflow, store a token with the `codespace` scope
# as the repository secret CODESPACES_TOKEN; without it the workflow reports
# the exact API response and stops.
#
# The maintained alternative needs no secret at all: create a Codespace from a
# throwaway branch that adds a postCreateCommand invoking
# tests/phase1/sandbox-probe.sh, then read the evidence from the repository
# issue the probe publishes. See docs/SECURITY.md section 4.
permissions:
  contents: read

concurrency:
  group: sandbox-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe a real Codespace
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      MACHINE: ${{ inputs.machine }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Create the Codespace
        id: create
        run: |
          set -uo pipefail
          body=$(gh api --method POST "/repos/${REPO}/codespaces" \
            -f ref=main \
            -f machine="${MACHINE}" \
            -f display_title="Cloud-Chrome Phase 1 sandbox probe" 2>&1)
          status=$?
          printf '%s\n' "$body" | head -40
          if [ "$status" -ne 0 ]; then
            echo "::error::the Codespaces API rejected this token (see the response above)"
            exit 1
          fi
          name=$(printf '%s' "$body" | jq -r '.name // empty')
          [ -n "$name" ] || { echo "::error::no codespace name in the response"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          printf 'Created Codespace: %s\n' "$name"

      - name: Wait for the Codespace to be running
        run: |
          set -uo pipefail
          name="${{ steps.create.outputs.name }}"
          for _ in $(seq 1 120); do
            state=$(gh api "/repos/${REPO}/codespaces/${name}" --jq '.state' 2>/dev/null || echo unknown)
            printf 'state=%s\n' "$state"
            case "$state" in
              Running) echo "Codespace is running."; exit 0 ;;
              Stopped|Unavailable|Deleted)
                echo "::error::Codespace entered state $state"
                gh codespace logs -c "$name" 2>&1 | tail -100 || true
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::timed out waiting for the Codespace"
          exit 1

      - name: Capture the Codespace creation log
        run: |
          set -uo pipefail
          gh codespace logs -c "${{ steps.create.outputs.name }}" 2>&1 \
            | tee "$RUNNER_TEMP/codespace-creation.log" || true

      - name: Run the probe inside the Codespace
        run: |
          set -uo pipefail
          name="${{ steps.create.outputs.name }}"
          out="$RUNNER_TEMP/sandbox-probe.txt"
          : > "$out"
          if gh codespace ssh -c "$name" -- bash -s < tests/phase1/sandbox-probe.sh > "$out" 2>&1; then
            echo "probe completed" >> "$out"
          else
            echo "probe did not complete over SSH; the response is below" >> "$out"
          fi
          cat "$out"

      - name: Publish the evidence
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Sandbox probe evidence"
            echo
            echo '```'
            cat "$RUNNER_TEMP/sandbox-probe.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandbox-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sandbox-probe.txt
            ${{ runner.temp }}/codespace-creation.log
          if-no-files-found: warn

      - name: Delete the Codespace
        if: always()
        run: |
          set -uo pipefail
          name="${{ steps.create.outputs.name }}"
          if [ -n "$name" ]; then
            gh api --method DELETE "/repos/${REPO}/codespaces/${name}" \
              && echo "Deleted Codespace $name" \
              || echo "::warning::could not delete Codespace $name; delete it at https://github.com/codespaces"
          fi
