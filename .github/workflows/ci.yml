name: ci

# CI: static validation, image build on a GitHub-hosted runner, in-image
# verification, seccomp regression tests and the runtime-privilege audit.
# No local Docker is required by contributors.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep ordinary CI runs isolated by ref; only the publisher below shares a
  # package-wide group, so PR test runs do not queue behind GHCR publication.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: cloud-chrome:devcontainer

jobs:
  lint:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell script lint
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts to lint."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # The external sources are followed, so that a script that
          # sources another one is checked together with it.
          shellcheck -x --severity=warning "${scripts[@]}"

      - name: Dockerfile lint
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          # DL3008 (pin every apt package) is disabled deliberately: the packages
          # Cloud-Chrome manages are pinned to an exact version, while the
          # remaining Ubuntu archive packages intentionally track security
          # updates. CI asserts the pinned packages stay pinned and that the
          # tracked packages are never older than the recorded version.
          # SC1091 is a false positive: versions.env is copied into the image at
          # build time and is not part of hadolint's shellcheck mock.
          /tmp/hadolint --ignore DL3008 --ignore SC1091 .devcontainer/Dockerfile

      - name: Workflow lint
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -C /tmp -xzf /tmp/actionlint
          /tmp/actionlint

      - name: Validate JSON documents
        run: |
          set -euo pipefail
          jq -e . .devcontainer/devcontainer.json > /dev/null
          jq -e '.SyncDisabled == true and .BrowserSignin == 0' \
            .devcontainer/chrome-policies/managed/cloudchrome.json > /dev/null
          echo "devcontainer.json and the Chrome managed policy are valid JSON."

      - name: Validate version pins
        run: |
          set -euo pipefail
          # Every key must be known, and every checksum must be a 64-char hex digest.
          allowed='|BASE_IMAGE_REPOSITORY|BASE_IMAGE_TAG|BASE_IMAGE_DIGEST|PINNED_TIGERVNC_VERSION|PINNED_WEBSOCKIFY_VERSION|PINNED_JQ_VERSION|TRACKED_XFCE4_VERSION|TRACKED_XFCE4_TERMINAL_VERSION|TRACKED_DBUS_X11_VERSION|TRACKED_GNOME_KEYRING_VERSION|TRACKED_LIBSECRET_VERSION|TRACKED_LIBSECRET_TOOLS_VERSION|TRACKED_XDOTOOL_VERSION|TRACKED_FONTS_LIBERATION2_VERSION|TRACKED_FONTS_NOTO_COLOR_EMOJI_VERSION|CHROME_VERSION|CHROME_DEB_URL|CHROME_DEB_SHA256|NOVNC_VERSION|NOVNC_URL|NOVNC_SHA256|AGE_VERSION|AGE_URL|AGE_SHA256|SECCOMP_BASE_REPOSITORY|SECCOMP_BASE_COMMIT|SECCOMP_BASE_URL|SECCOMP_BASE_SHA256|'
          while IFS= read -r line; do
            case "$line" in ''|\#*) continue ;; esac
            key="${line%%=*}"
            value="${line#*=}"
            case "$allowed" in
              *"|$key|"*) ;;
              *) echo "Unknown key in config/versions.env: $key" >&2; exit 1 ;;
            esac
            [ -n "$value" ] || { echo "Empty value for $key" >&2; exit 1; }
            case "$key" in
              *_SHA256) [[ "$value" =~ ^[0-9a-f]{64}$ ]] || { echo "Bad SHA-256 for $key" >&2; exit 1; } ;;
              BASE_IMAGE_DIGEST) [[ "$value" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Bad digest for $key" >&2; exit 1; } ;;
            esac
          done < config/versions.env
          echo "config/versions.env keys and checksums are well formed."

      - name: Validate the configuration file parses as shell
        run: |
          set -euo pipefail
          bash -n .devcontainer/cloudchrome.env
          ! grep -qiE '(password|passphrase|secret|token)\s*=\s*\S' .devcontainer/cloudchrome.env \
            || { echo "cloudchrome.env must not contain secret values" >&2; exit 1; }
          echo ".devcontainer/cloudchrome.env parses and contains no secret values."

      - name: Verify the seccomp profile still matches the pinned upstream baseline
        run: |
          set -euo pipefail
          # Regenerates the profile from the pinned upstream baseline plus the
          # declared namespace rules and compares it with the committed file, so
          # an upstream restriction cannot be silently dropped.
          bash tests/probe/render-seccomp-profile.sh --verify

      - name: Verify the runtime sources are lint-clean
        run: |
          set -euo pipefail
          # The runtime is a Python package; a syntax error would only surface
          # at runtime, in the container, where it is hardest to diagnose.
          python3 -m compileall -q lib/cloudchrome
          echo "ok       the runtime package compiles"

      - name: Check the reachability of the Ubuntu archive
        run: |
          set -uo pipefail
          # The archive host is checked first, so a network problem is
          # reported as such instead of as a build failure.
          for host in archive.ubuntu.com security.ubuntu.com ports.ubuntu.com \
                      mirror.aarnet.edu.au ftp.lysator.liu.se ubuntu.mirror.constant.com \
                      mirror.math.princeton.edu mirrorservice.org; do
            if getent hosts "$host" > /dev/null 2>&1; then
              echo "ok       $host resolves"
            else
              echo "warning  $host does not resolve on this runner"
            fi
          done
          echo "--- the resolver ---"
          cat /etc/resolv.conf | sed 's/^/      /'

      - name: Check the probes
        run: |
          set -euo pipefail
          # The probes run inside a Codespaces dev container, so CI cannot
          # run them end to end. What CI checks is that they are well
          # formed, that the performance probe stays isolated from the real
          # state, and that it still cleans up after itself.
          bash tests/probe/check-probes.sh | tee "$RUNNER_TEMP/probes.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the runtime unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/unit -t tests/unit -v

      - name: Verify the CLI entry point is executable and self-contained
        run: |
          set -euo pipefail
          test -x bin/cloudchrome || { echo "bin/cloudchrome is not executable" >&2; exit 1; }
          bash -n bin/cloudchrome
          # The entry point must delegate to the implementation package and
          # must not contain policy of its own.
          grep -q 'python3 -m cloudchrome.cli' bin/cloudchrome
          echo "ok       bin/cloudchrome delegates to the cloudchrome package"

  build:
    name: Build and verify the image
    runs-on: ubuntu-latest
    needs: lint
    concurrency:
      # Keep all jobs that consume cloud-chrome-image inside the same-run
      # artifact lifetime. The publisher still has its package-wide lock.
      group: cloud-chrome-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      image_id: ${{ steps.image-identity.outputs.image_id }}
      artifact_id: ${{ steps.uploaded-artifact.outputs.artifact_id }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the Dockerfile digest matches config/versions.env
        run: |
          set -euo pipefail
          . config/versions.env
          grep -q "FROM ${BASE_IMAGE_REPOSITORY}:${BASE_IMAGE_TAG}@${BASE_IMAGE_DIGEST}" \
            .devcontainer/Dockerfile \
            || { echo "Dockerfile base image does not match config/versions.env" >&2; exit 1; }

      - name: Build the image
        id: build-image
        run: |
          set -euo pipefail
          # The build duration is measured, because the performance report
          # has to say how long the image takes to build. It is the time
          # of this step only: the packages come from the cache of the
          # runner, so the number is the time of an incremental build.
          build_started=$(date +%s)
          docker build --platform linux/amd64 \
            --build-arg TARGETARCH=amd64 \
            --build-arg OCI_SOURCE=https://github.com/mosabbir-maruf/Cloud-Chrome \
            --build-arg "OCI_REVISION=$GITHUB_SHA" \
            --build-arg "OCI_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f .devcontainer/Dockerfile \
            -t "$IMAGE_NAME" .
          build_seconds=$(( $(date +%s) - build_started ))
          size_bytes=$(docker image inspect "$IMAGE_NAME" --format '{{.Size}}')
          echo "IMAGE_SIZE_BYTES=$size_bytes" | tee -a "$GITHUB_OUTPUT"
          echo "IMAGE_BUILD_SECONDS=$build_seconds" | tee -a "$GITHUB_OUTPUT"
          echo "image_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          {
            echo "## Image size"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Uncompressed image size | $((size_bytes / 1024 / 1024)) MiB ($size_bytes bytes) |"
            echo "| Build duration | $build_seconds s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record built image identity
        id: image-identity
        run: |
          set -euo pipefail
          image_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$image_id" = "${{ steps.build-image.outputs.image_id }}" ] || {
            echo "Image config ID changed after the original build." >&2
            exit 1
          }
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Unexpected Docker image config ID: $image_id" >&2
            exit 1
          }
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "Built image config ID: $image_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Export the image for the dependent jobs
        id: export-image
        run: |
          set -euo pipefail
          # The runtime, backup and hardening jobs run on their own runner,
          # so the image is passed to them as an artefact.
          docker save "$IMAGE_NAME" | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
          echo "image_size_bytes=$(stat -c '%s' "$RUNNER_TEMP/image.tar.gz")" >> "$GITHUB_OUTPUT"
          saved_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$saved_id" = "${{ steps.image-identity.outputs.image_id }}" ] || {
            echo "Image config ID changed before export." >&2
            exit 1
          }

      - name: Upload the image artefact
        id: upload-image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-chrome-image
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Record uploaded artifact ID
        id: uploaded-artifact
        run: |
          set -euo pipefail
          artifact_id='${{ steps.upload-image.outputs.artifact-id }}'
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || { echo "upload-artifact did not return a valid artifact-id." >&2; exit 1; }
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Confirm exported image identity
        run: |
          set -euo pipefail
          exported_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$exported_id" = "${{ steps.image-identity.outputs.image_id }}" ] || {
            echo "Exported image identity differs from the built image." >&2
            exit 1
          }

      - name: Verify installed dependencies inside the image
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-image.sh" <<'VERIFY'
          set -uo pipefail
          fail=0
          . /usr/local/share/cloudchrome/versions.env

          check_exact() { # name expected actual
            if [ "$2" = "$3" ]; then
              printf 'ok       %-34s %s\n' "$1" "$3"
            else
              printf 'MISMATCH %-34s expected=%s actual=%s\n' "$1" "$2" "$3"
              fail=1
            fi
          }
          check_tracked() { # name minimum actual
            if dpkg --compare-versions "$3" ge "$2"; then
              printf 'ok       %-34s %s (>= %s)\n' "$1" "$3" "$2"
            else
              printf 'MISMATCH %-34s installed=%s older than recorded=%s\n' "$1" "$3" "$2"
              fail=1
            fi
          }

          printf '=== runtime identity ===\n'
          printf 'user=%s uid=%s\n' "$(id -un)" "$(id -u)"
          [ "$(id -un)" = "vscode" ] || { echo "container does not run as vscode" >&2; fail=1; }

          printf '\n=== pinned packages (exact version required) ===\n'
          check_exact tigervnc-standalone-server "$PINNED_TIGERVNC_VERSION" "$(dpkg-query -W -f='${Version}' tigervnc-standalone-server)"
          check_exact tigervnc-common            "$PINNED_TIGERVNC_VERSION" "$(dpkg-query -W -f='${Version}' tigervnc-common)"
          check_exact tigervnc-tools             "$PINNED_TIGERVNC_VERSION" "$(dpkg-query -W -f='${Version}' tigervnc-tools)"
          check_exact websockify                 "$PINNED_WEBSOCKIFY_VERSION" "$(dpkg-query -W -f='${Version}' websockify)"
          check_exact jq                         "$PINNED_JQ_VERSION" "$(dpkg-query -W -f='${Version}' jq)"

          printf '\n=== tracked packages (must not be older than recorded) ===\n'
          check_tracked xfce4                    "$TRACKED_XFCE4_VERSION" "$(dpkg-query -W -f='${Version}' xfce4)"
          check_tracked xfce4-terminal           "$TRACKED_XFCE4_TERMINAL_VERSION" "$(dpkg-query -W -f='${Version}' xfce4-terminal)"
          check_tracked dbus-x11                 "$TRACKED_DBUS_X11_VERSION" "$(dpkg-query -W -f='${Version}' dbus-x11)"
          check_tracked gnome-keyring            "$TRACKED_GNOME_KEYRING_VERSION" "$(dpkg-query -W -f='${Version}' gnome-keyring)"
          check_tracked libsecret-1-0            "$TRACKED_LIBSECRET_VERSION" "$(dpkg-query -W -f='${Version}' libsecret-1-0)"
          check_tracked libsecret-tools          "$TRACKED_LIBSECRET_TOOLS_VERSION" "$(dpkg-query -W -f='${Version}' libsecret-tools)"
          check_tracked xdotool                  "$TRACKED_XDOTOOL_VERSION" "$(dpkg-query -W -f='${Version}' xdotool)"
          check_tracked fonts-liberation2        "$TRACKED_FONTS_LIBERATION2_VERSION" "$(dpkg-query -W -f='${Version}' fonts-liberation2)"
          check_tracked fonts-noto-color-emoji   "$TRACKED_FONTS_NOTO_COLOR_EMOJI_VERSION" "$(dpkg-query -W -f='${Version}' fonts-noto-color-emoji)"

          printf '\n=== downloaded artefact versions ===\n'
          # The .deb version carries a Debian revision (e.g. 157.0.8103.50-1);
          # the browser itself reports the upstream version.
          check_exact google-chrome "${CHROME_VERSION%-*}" "$(google-chrome --version | sed -E 's#^Google Chrome ([^ ]+).*#\1#')"
          check_exact age "$AGE_VERSION" "$(age --version | sed -E 's#^v?([0-9].*)#\1#')"
          check_exact noVNC "$NOVNC_VERSION" "$(jq -r .version /usr/local/share/novnc/package.json)"

          printf '\n=== required binaries ===\n'
          for bin in Xtigervnc tigervncpasswd tigervncconfig websockify google-chrome \
                     xfce4-session startxfce4 xfwm4 dbus-launch dbus-daemon dbus-send gnome-keyring-daemon secret-tool \
                     xdotool age age-keygen jq curl sha256sum flock setsid timeout \
                     python3 tar; do
            if command -v "$bin" > /dev/null 2>&1; then
              printf 'ok       %-24s %s\n' "$bin" "$(command -v "$bin")"
            else
              printf 'MISSING  %-24s\n' "$bin"; fail=1
            fi
          done
          # 'script' is only the fallback for the password file; the primary
          # path is the filter mode of tigervncpasswd.
          if command -v script > /dev/null 2>&1; then
            printf 'ok       %-24s %s\n' "script (optional)" "$(command -v script)"
          else
            printf 'note     %-24s not installed; the filter mode is used instead\n' "script (optional)"
          fi

          printf '\n=== chrome managed policy ===\n'
          policy=/etc/opt/chrome/policies/managed/cloudchrome.json
          ls -l "$policy"
          stat -c 'owner=%U group=%G mode=%a' "$policy"
          jq -e '.SyncDisabled == true and .BrowserSignin == 0' "$policy" > /dev/null \
            && echo 'ok       policy content' || { echo 'MISMATCH policy content'; fail=1; }
          [ -w "$policy" ] && { echo 'policy is writable by the runtime user'; fail=1; } \
            || echo 'ok       policy is not writable by the runtime user'
          [ -w /etc/opt/chrome/policies/managed ] \
            && { echo 'the runtime user can replace the policy'; fail=1; } \
            || echo 'ok       the runtime user cannot replace the policy'

          printf '\n=== runtime privileges ===\n'
          if sudo -n true 2>/dev/null; then
            echo 'the runtime user still has passwordless root'; fail=1
          else
            echo 'ok       sudo -n true fails for the runtime user'
          fi
          if sudo -n -l 2>/dev/null | grep -q 'ALL'; then
            echo 'the runtime user still holds an ALL sudo rule'; fail=1
          else
            echo 'ok       no blanket sudo rule for the runtime user'
          fi

          printf '\n=== no personal data or secrets in the image ===\n'
          for path in /workspaces/.cloudchrome /root/.cloudchrome /home/vscode/.cloudchrome; do
            if [ -e "$path" ]; then echo "unexpected path in image: $path"; fail=1; fi
          done
          # The non-secret configuration file is expected in the image. It must
          # be readable by everyone but must not carry a secret.
          if [ ! -f /etc/cloudchrome/cloudchrome.env ]; then
            echo 'the configuration file is missing from the image'; fail=1
          else
            stat -c 'owner=%U group=%G mode=%a' /etc/cloudchrome/cloudchrome.env
            if grep -qiE '(password|passphrase|secret|token|key)[[:space:]]*=[[:space:]]*[^[:space:]]' \
                /etc/cloudchrome/cloudchrome.env; then
              echo 'the configuration file carries a secret value'; fail=1
            else
              echo 'ok       the configuration file carries no secret value'
            fi
          fi
          if find / -xdev \( -name '*.age' -o -name 'SingletonLock' -o -name 'Login Data' \) \
               -print -quit 2>/dev/null | grep -q .; then
            echo 'unexpected browser or backup data in image'; fail=1
          else
            echo 'ok       no profile, keyring or backup data in the image'
          fi

          printf '\n=== result ===\n'
          [ "$fail" -eq 0 ] && echo 'ALL CHECKS PASSED' || echo 'CHECKS FAILED'
          exit "$fail"
          VERIFY
          docker run --rm -i "$IMAGE_NAME" bash -s < "$RUNNER_TEMP/verify-image.sh"

      - name: Run the runtime unit tests inside the image
        run: |
          set -euo pipefail
          # The age tools are part of the image, so the tests that need
          # them run here. On the runner they are skipped, and the tests
          # that cover the restore transaction would never run at all.
          docker run --rm -i \
            -v "$PWD:/repo:ro" \
            "$IMAGE_NAME" python3 -m unittest discover -s /repo/tests/unit -t /repo/tests/unit -v \
            | tee "$RUNNER_TEMP/unit-in-image.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Audit the base image's sudo grant
        run: |
          set -euo pipefail
          . config/versions.env
          base="${BASE_IMAGE_REPOSITORY}:${BASE_IMAGE_TAG}@${BASE_IMAGE_DIGEST}"
          docker pull --quiet "$base" > /dev/null
          {
            echo "## Runtime privilege audit"
            echo
            echo "### Base image (${BASE_IMAGE_REPOSITORY}:${BASE_IMAGE_TAG})"
            echo
            echo '```'
            echo "$ cat /etc/sudoers.d/vscode"
            docker run --rm "$base" cat /etc/sudoers.d/vscode 2>&1 || echo "<no such file>"
            echo
            echo "$ sudo -n true   (as the vscode user)"
            if docker run --rm --user vscode "$base" sudo -n true 2>&1; then
              echo "exit 0 -> the base image grants the runtime user passwordless root"
            else
              echo "non-zero exit -> no blanket sudo grant"
            fi
            echo '```'
            echo
            echo "### Cloud-Chrome image"
            echo
            echo '```'
            echo "$ sudo -n true   (as the vscode user)"
            if docker run --rm --user vscode "$IMAGE_NAME" sudo -n true 2>&1; then
              echo "exit 0 -> FAIL: the runtime user still has passwordless root"
              exit 1
            else
              echo "non-zero exit -> ok: no passwordless root"
            fi
            echo "$ sudo -n -l"
            docker run --rm --user vscode "$IMAGE_NAME" sudo -n -l 2>&1 || true
            echo "$ test -w /etc/opt/chrome/policies/managed/cloudchrome.json"
            if docker run --rm --user vscode "$IMAGE_NAME" test -w /etc/opt/chrome/policies/managed/cloudchrome.json; then
              echo "writable -> FAIL: the runtime user can modify the managed Chrome policy"
              exit 1
            else
              echo "not writable -> ok"
            fi
            echo "$ test -w /etc/opt/chrome/policies/managed"
            if docker run --rm --user vscode "$IMAGE_NAME" test -w /etc/opt/chrome/policies/managed; then
              echo "writable -> FAIL: the runtime user can replace the managed Chrome policy"
              exit 1
            else
              echo "not writable -> ok"
            fi
            echo '```'
          } > "$RUNNER_TEMP/sudo-audit.txt"
          cat "$RUNNER_TEMP/sudo-audit.txt"
          cat "$RUNNER_TEMP/sudo-audit.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Seccomp regression tests with the Cloud-Chrome profile
        run: |
          set -euo pipefail
          profile="$PWD/.devcontainer/seccomp/chrome.json"
          docker run --rm -i \
            --security-opt "seccomp=$profile" \
            -e CLOUDCHROME_PROFILE_LABEL="cloud-chrome profile" \
            "$IMAGE_NAME" bash -s < tests/probe/seccomp-regression.sh \
            | tee "$RUNNER_TEMP/seccomp-custom.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Seccomp regression with the unmodified upstream baseline
        run: |
          set -uo pipefail
          # The upstream baseline is measured unchanged, so the effect of the
          # Cloud-Chrome profile (including the removal of the 32-bit socketcall
          # compatibility path) is demonstrated rather than asserted.
          set +e
          bash tests/probe/render-seccomp-profile.sh --render-baseline "$RUNNER_TEMP/upstream-default.json"
          docker run --rm -i \
            --security-opt "seccomp=$RUNNER_TEMP/upstream-default.json" \
            -e CLOUDCHROME_PROFILE_LABEL="upstream baseline (unchanged)" \
            "$IMAGE_NAME" bash -s < tests/probe/seccomp-regression.sh \
            > "$RUNNER_TEMP/seccomp-upstream.txt" 2>&1
          upstream_rc=$?
          set -e
          {
            echo
            echo "### Unmodified upstream baseline (exit $upstream_rc)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/seccomp-upstream.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "upstream-baseline regression exit: $upstream_rc (recorded, not asserted)"

      - name: Seccomp comparison with the Docker daemon's default profile
        run: |
          set -uo pipefail
          # The daemon's own default profile is expected to deny the namespace
          # operations Chromium needs. The run is recorded, not asserted, so the
          # difference between the profiles is visible in the summary.
          set +e
          docker run --rm -i \
            -e CLOUDCHROME_PROFILE_LABEL="daemon default profile" \
            "$IMAGE_NAME" bash -s < tests/probe/seccomp-regression.sh \
            > "$RUNNER_TEMP/seccomp-default.txt" 2>&1
          default_rc=$?
          set -e
          {
            echo
            echo "### Docker daemon default profile (exit $default_rc)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/seccomp-default.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "default-profile regression exit: $default_rc (recorded, not asserted)"

      - name: Record the before/after syscall behaviour
        run: |
          set -euo pipefail
          {
            echo
            echo "### Profile comparison"
            echo
            echo "| Probe | Cloud-Chrome profile | Upstream baseline | Daemon default |"
            echo "| --- | --- | --- | --- |"
            for probe in 'socket(AF_ALG=38)' 'socket(AF_VSOCK=40)' 'socketcall_compat(AF_ALG=38)' \
                         'socketcall_compat(AF_VSOCK=40)' 'socketpair(AF_NETLINK=16)' \
                         'unshare(CLONE_NEWUSER)' 'unshare(CLONE_NEWUSER|CLONE_NEWNET)' \
                         'clone(CLONE_NEWUSER|SIGCHLD)' \
                         'clone(CLONE_NEWUSER|CLONE_VM|SIGCHLD)' \
                         'clone(CLONE_NEWUSER|CLONE_PTRACE|SIGCHLD)'; do
              custom=$(grep -F "$probe" "$RUNNER_TEMP/seccomp-custom.txt" | head -1 | sed 's/  */ /g' || true)
              upstream=$(grep -F "$probe" "$RUNNER_TEMP/seccomp-upstream.txt" | head -1 | sed 's/  */ /g' || true)
              default=$(grep -F "$probe" "$RUNNER_TEMP/seccomp-default.txt" | head -1 | sed 's/  */ /g' || true)
              echo "| $probe | ${custom:-n/a} | ${upstream:-n/a} | ${default:-n/a} |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify no personal data or secrets are tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.cloudchrome/|\.age$|\.tar\.gz$|SingletonLock|Login Data'; then
            echo "Personal browser data or archives are tracked in git" >&2
            exit 1
          fi
          echo "ok       no personal browser data is tracked"

      - name: Verify the build context excludes personal data
        run: |
          set -euo pipefail
          for pattern in '.cloudchrome/' 'backups/' '*.age' '*.log'; do
            grep -qxF "$pattern" .dockerignore \
              || { echo "missing .dockerignore entry: $pattern" >&2; exit 1; }
          done
          echo "ok       .dockerignore excludes personal data"

  runtime:
    name: Desktop Runtime & Lifecycle Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-chrome-image
          path: ${{ runner.temp }}/image

      - name: Load the image
        run: |
          set -euo pipefail
          gunzip -c "$RUNNER_TEMP/image/image.tar.gz" | docker load
          loaded_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$loaded_id" = "${{ needs.build.outputs.image_id }}" ] || {
            echo "Runtime job loaded image $loaded_id, expected build image ${{ needs.build.outputs.image_id }}." >&2
            exit 1
          }
          docker image inspect "$IMAGE_NAME" --format '{{.Size}}'

      - name: Run the keyring test inside the image
        run: |
          set -euo pipefail
          # The keyring is measured on its own, because it is the component
          # that fails in the most obscure ways.
          docker run --rm -i \
            -e CLOUDCHROME_PERSIST_DIR=/tmp/cloudchrome-keyring/.cloudchrome \
            -e CLOUDCHROME_RUNTIME_DIR=/tmp/cloudchrome-keyring/.cloudchrome/run \
            -v "$PWD:/repo:ro" \
            "$IMAGE_NAME" bash /repo/tests/runtime/keyring-tests.sh \
            | tee "$RUNNER_TEMP/keyring.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the desktop stack test inside the image
        run: |
          set -euo pipefail
          # The complete desktop stack: the X/VNC server, the D-Bus bus, the
          # keyring, the XFCE session, the noVNC bridge and Chrome. It comes
          # up, stays up, goes down in order and comes up again.
          docker run --rm -i \
            --security-opt "seccomp=$PWD/.devcontainer/seccomp/chrome.json" \
            -e CLOUDCHROME_PERSIST_DIR=/tmp/cloudchrome-stack/.cloudchrome \
            -e CLOUDCHROME_RUNTIME_DIR=/tmp/cloudchrome-stack/.cloudchrome/run \
            -v "$PWD:/repo:ro" \
            "$IMAGE_NAME" bash /repo/tests/runtime/stack-tests.sh \
            | tee "$RUNNER_TEMP/stack.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the persistent state test inside the image
        run: |
          set -euo pipefail
          # The profile and the Secret Service item have to survive a real
          # stop and a real start of the desktop stack, with the same
          # persistent state directory. Only synthetic data is used.
          docker run --rm -i \
            --security-opt "seccomp=$PWD/.devcontainer/seccomp/chrome.json" \
            -e CLOUDCHROME_PERSIST_DIR=/tmp/cloudchrome-persist/.cloudchrome \
            -e CLOUDCHROME_RUNTIME_DIR=/tmp/cloudchrome-persist/.cloudchrome/run \
            -v "$PWD:/repo:ro" \
            "$IMAGE_NAME" bash /repo/tests/runtime/persistence-tests.sh \
            | tee "$RUNNER_TEMP/persist.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the runtime test suite inside the image
        run: |
          set -euo pipefail
          # The tests run INSIDE the built image, so they exercise the same
          # binaries and the same privileges the Codespace runs with.
          docker run --rm -i \
            -e CLOUDCHROME_PERSIST_DIR=/tmp/cloudchrome-test/.cloudchrome \
            -e CLOUDCHROME_RUNTIME_DIR=/tmp/cloudchrome-test/.cloudchrome/run \
            -v "$PWD:/repo:ro" \
            "$IMAGE_NAME" bash /repo/tests/runtime/runtime-tests.sh \
            | tee "$RUNNER_TEMP/runtime.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the installed CLI matches the repository
        run: |
          set -euo pipefail
          # The image carries a copy of the runtime. It must be identical to
          # the repository, otherwise the running code and the source would
          # drift apart.
          for file in $(cd lib && find cloudchrome -name '*.py' | sort); do
            local_sum=$(sha256sum "lib/$file" | cut -d' ' -f1)
            image_sum=$(docker run --rm --entrypoint sha256sum "$IMAGE_NAME" \
              "/usr/local/lib/cloudchrome/lib/$file" | cut -d' ' -f1)
            [ "$local_sum" = "$image_sum" ] \
              || { echo "the installed $file differs from the repository copy" >&2; exit 1; }
          done
          local_sum=$(sha256sum bin/cloudchrome | cut -d' ' -f1)
          image_sum=$(docker run --rm --entrypoint sha256sum "$IMAGE_NAME" \
            /usr/local/lib/cloudchrome/bin/cloudchrome | cut -d' ' -f1)
          [ "$local_sum" = "$image_sum" ] \
            || { echo "the installed CLI differs from the repository copy" >&2; exit 1; }
          echo "ok       the installed runtime is identical to the repository"

      - name: Verify runtime tests used the built image identity
        run: |
          set -euo pipefail
          loaded_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$loaded_id" = "${{ needs.build.outputs.image_id }}" ] || {
            echo "Runtime test image identity changed during the job." >&2
            exit 1
          }

      - name: Verify the CLI works in the image
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE_NAME" cloudchrome version
          docker run --rm "$IMAGE_NAME" cloudchrome --help | head -5
          echo "ok       the CLI runs in the image"

  backup:
    name: Backup, Restore & Recovery Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-chrome-image
          path: ${{ runner.temp }}/image

      - name: Load the image
        run: |
          set -euo pipefail
          gunzip -c "$RUNNER_TEMP/image/image.tar.gz" | docker load
          loaded_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$loaded_id" = "${{ needs.build.outputs.image_id }}" ] || {
            echo "Backup job loaded an image different from the tested build artifact." >&2
            exit 1
          }

      - name: Run the backup and restore tests inside the image
        run: |
          set -euo pipefail
          docker run --rm -i \
            --security-opt "seccomp=$PWD/.devcontainer/seccomp/chrome.json" \
            -e CLOUDCHROME_PERSIST_DIR=/tmp/cloudchrome-test/.cloudchrome \
            -e CLOUDCHROME_RUNTIME_DIR=/tmp/cloudchrome-test/.cloudchrome/run \
            -v "$PWD:/repo:ro" \
            "$IMAGE_NAME" bash /repo/tests/runtime/backup-restore-tests.sh \
            | tee "$RUNNER_TEMP/backup-restore.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the backup transaction tests inside the image
        run: |
          set -euo pipefail
          # The backup, the restore and the transaction, with and without a
          # running desktop stack, and the failure paths of the restore.
          docker run --rm -i \
            --security-opt "seccomp=$PWD/.devcontainer/seccomp/chrome.json" \
            -e CLOUDCHROME_PERSIST_DIR=/tmp/cloudchrome-backup/.cloudchrome \
            -e CLOUDCHROME_RUNTIME_DIR=/tmp/cloudchrome-backup/.cloudchrome/run \
            -v "$PWD:/repo:ro" \
            "$IMAGE_NAME" bash /repo/tests/runtime/backup-tests.sh \
            | tee "$RUNNER_TEMP/backup.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the profile and keyring tests inside the image
        run: |
          set -euo pipefail
          docker run --rm -i \
            --security-opt "seccomp=$PWD/.devcontainer/seccomp/chrome.json" \
            -e CLOUDCHROME_PERSIST_DIR=/tmp/cloudchrome-test/.cloudchrome \
            -e CLOUDCHROME_RUNTIME_DIR=/tmp/cloudchrome-test/.cloudchrome/run \
            -v "$PWD:/repo:ro" \
            "$IMAGE_NAME" bash /repo/tests/runtime/profile-and-keyring-tests.sh \
            | tee "$RUNNER_TEMP/profile-keyring.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify backup tests used the built image identity
        run: |
          set -euo pipefail
          loaded_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$loaded_id" = "${{ needs.build.outputs.image_id }}" ] || {
            echo "Backup test image identity changed during the job." >&2
            exit 1
          }

  hardening:
    name: Security Regression & Failure-Injection Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-chrome-image
          path: ${{ runner.temp }}/image

      - name: Load the image
        run: |
          set -euo pipefail
          gunzip -c "$RUNNER_TEMP/image/image.tar.gz" | docker load
          loaded_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$loaded_id" = "${{ needs.build.outputs.image_id }}" ] || {
            echo "Security job loaded an image different from the tested build artifact." >&2
            exit 1
          }

      - name: Run the security regression and failure-injection tests inside the image
        run: |
          set -euo pipefail
          docker run --rm -i \
            -e CLOUDCHROME_PERSIST_DIR=/tmp/cloudchrome-test/.cloudchrome \
            -e CLOUDCHROME_RUNTIME_DIR=/tmp/cloudchrome-test/.cloudchrome/run \
            -v "$PWD:/repo:ro" \
            "$IMAGE_NAME" bash /repo/tests/runtime/security-regression-tests.sh \
            | tee "$RUNNER_TEMP/security-regression.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the seccomp regressions still hold
        run: |
          set -euo pipefail
          # The hardening must not have weakened the sandbox: the whole
          # seccomp regression suite runs again here.
          profile="$PWD/.devcontainer/seccomp/chrome.json"
          docker run --rm -i \
            --security-opt "seccomp=$profile" \
            -e CLOUDCHROME_PROFILE_LABEL="cloud-chrome profile" \
            "$IMAGE_NAME" bash -s < tests/probe/seccomp-regression.sh \
            | tee "$RUNNER_TEMP/seccomp-regression.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the Chrome sandbox is still active in the image
        run: |
          set -euo pipefail
          # The launch policy must name the forbidden flags, so a future
          # change cannot quietly add one.
          for flag in no-sandbox disable-setuid-sandbox remote-debugging-port; do
            grep -q -- "--$flag" lib/cloudchrome/chrome.py \
              || { echo "the launch policy does not name --$flag" >&2; exit 1; }
          done
          echo "ok       the launch policy names every forbidden flag"

          # The container must still have no CAP_SYS_ADMIN and no sudo rule.
          profile="$PWD/.devcontainer/seccomp/chrome.json"
          docker run --rm \
            --security-opt "seccomp=$profile" \
            "$IMAGE_NAME" bash -c '
              cap_bnd=$(awk "/^CapBnd:/{print \$2}" /proc/self/status)
              echo "CapBnd=$cap_bnd"
              if python3 -c "import sys; sys.exit(0 if (int(\"$cap_bnd\",16) >> 21) & 1 else 1)"; then
                echo "CAP_SYS_ADMIN is present"; exit 1
              fi
              if sudo -n true 2>/dev/null; then
                echo "passwordless root is available"; exit 1
              fi
              echo "ok       no CAP_SYS_ADMIN and no passwordless root"
            '

      - name: Verify security tests used the built image identity
        run: |
          set -euo pipefail
          loaded_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$loaded_id" = "${{ needs.build.outputs.image_id }}" ] || {
            echo "Security test image identity changed during the job." >&2
            exit 1
          }

  publish:
    name: Publish Prebuilt Image to GHCR
    runs-on: ubuntu-latest
    needs: [lint, build, runtime, backup, hardening]
    outputs:
      image_changed: ${{ steps.image-inputs.outputs.changed }}
      published_digest: ${{ steps.publish.outputs.digest }}
    if: >-
      needs.lint.result == 'success' &&
      needs.build.result == 'success' &&
      needs.runtime.result == 'success' &&
      needs.backup.result == 'success' &&
      needs.hardening.result == 'success' &&
      github.repository == 'mosabbir-maruf/Cloud-Chrome' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    concurrency:
      # One lock covers both pushing and retention for this package. Never
      # cancel the holder: a new main run queues until push+retention finish.
      group: cloud-chrome-ghcr-publisher
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Recheck after acquiring the publisher lock. Older queued runs exit
      # before touching GHCR if main has moved on.
      - name: Verify this commit is current main immediately before publication
        id: current-main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          CURRENT_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "$API_URL/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          [ "$main_sha" = "$CURRENT_SHA" ] || {
            echo "This run is stale: main is $main_sha, event commit is $CURRENT_SHA. Publication skipped."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Detect image input changes
        id: image-inputs
        if: steps.current-main.outputs.current == 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual publication requested on main."
            exit 0
          fi
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No usable push before-SHA; treating this as an image change."
            exit 0
          fi
          if git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- \
            .devcontainer/Dockerfile \
            .devcontainer/devcontainer.json \
            .devcontainer/cloudchrome.env \
            .devcontainer/chrome-policies/ \
            config/versions.env \
            .dockerignore \
            bin/ \
            lib/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Image-affecting inputs changed in the complete push range."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No image-affecting inputs changed; publication skipped."
          fi

      - name: Verify this commit is still current main before publication
        if: steps.current-main.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "$API_URL/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          [ "$main_sha" = "$CURRENT_SHA" ] || {
            echo "Main advanced to $main_sha before publication; refusing to publish stale $CURRENT_SHA." >&2
            exit 1
          }

      - name: Download the tested image artifact
        if: steps.current-main.outputs.current == 'true' && steps.image-inputs.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-chrome-image
          path: ${{ runner.temp }}/image

      - name: Verify uploaded image identity
        id: verify-artifact-image
        if: steps.current-main.outputs.current == 'true' && steps.image-inputs.outputs.changed == 'true'
        env:
          EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/image/image.tar.gz"
          gunzip -c "$RUNNER_TEMP/image/image.tar.gz" | docker load
          actual_image_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$actual_image_id" = "$EXPECTED_IMAGE_ID" ] || {
            echo "Artifact image identity $actual_image_id differs from tested build identity $EXPECTED_IMAGE_ID." >&2
            exit 1
          }
          echo "Verified uploaded tested image config ID: $actual_image_id"

      - name: Load and verify the tested image
        id: loaded-image
        if: steps.current-main.outputs.current == 'true' && steps.image-inputs.outputs.changed == 'true'
        env:
          EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE_NAME" >/dev/null
          actual_image_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$actual_image_id" = "$EXPECTED_IMAGE_ID" ] || {
            echo "Publisher image identity changed after artifact load." >&2
            exit 1
          }
          echo "image_id=$actual_image_id" >> "$GITHUB_OUTPUT"

      - name: Prepare tested image tags
        if: steps.current-main.outputs.current == 'true' && steps.image-inputs.outputs.changed == 'true'
        id: metadata-image
        env:
          GHCR_IMAGE: ghcr.io/mosabbir-maruf/cloud-chrome
          EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: |
          set -euo pipefail
          image_id=$(docker image inspect "$IMAGE_NAME" --format '{{.Id}}')
          [ "$image_id" = "$EXPECTED_IMAGE_ID" ] || {
            echo "Refusing to tag an image other than the tested build artifact." >&2
            exit 1
          }
          docker image tag "$image_id" "$GHCR_IMAGE:latest"
          docker image tag "$image_id" "$GHCR_IMAGE:sha-$GITHUB_SHA"
          [ "$(docker image inspect "$GHCR_IMAGE:latest" --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID" ]
          [ "$(docker image inspect "$GHCR_IMAGE:sha-$GITHUB_SHA" --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID" ]
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Final main HEAD check before GHCR push
        if: steps.current-main.outputs.current == 'true' && steps.image-inputs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "$API_URL/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          [ "$main_sha" = "$CURRENT_SHA" ] || {
            echo "Main advanced to $main_sha immediately before GHCR push; refusing stale $CURRENT_SHA." >&2
            exit 1
          }

      - name: Publish both tags and verify the registry digest
        id: publish
        if: steps.current-main.outputs.current == 'true' && steps.image-inputs.outputs.changed == 'true'
        env:
          GHCR_IMAGE: ghcr.io/mosabbir-maruf/cloud-chrome
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          unset GHCR_TOKEN
          [ -n "$PUBLISHED_IMAGE_ID" ]
          [ "$(docker image inspect "$GHCR_IMAGE:latest" --format '{{.Id}}')" = "$PUBLISHED_IMAGE_ID" ] \
            || { echo "the published tag does not point to the exact tested image" >&2; exit 1; }
          docker push "$GHCR_IMAGE:sha-$GITHUB_SHA" | tee "$RUNNER_TEMP/push-sha.txt"
          docker push "$GHCR_IMAGE:latest" | tee "$RUNNER_TEMP/push-latest.txt"
          sha_digest=$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$RUNNER_TEMP/push-sha.txt" | tail -1)
          latest_digest=$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$RUNNER_TEMP/push-latest.txt" | tail -1)
          [ -n "$sha_digest" ] && [ "$sha_digest" = "$latest_digest" ] \
            || { echo "tag pushes did not resolve to the same digest" >&2; exit 1; }
          echo "digest=$sha_digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$GHCR_IMAGE:latest" --raw > "$RUNNER_TEMP/manifest-latest.json"
          docker buildx imagetools inspect "$GHCR_IMAGE:sha-$GITHUB_SHA" --raw > "$RUNNER_TEMP/manifest-sha.json"
          sha_manifest_digest=$(sha256sum "$RUNNER_TEMP/manifest-sha.json" | awk '{print "sha256:" $1}')
          latest_manifest_digest=$(sha256sum "$RUNNER_TEMP/manifest-latest.json" | awk '{print "sha256:" $1}')
          [ "$latest_manifest_digest" = "$sha_manifest_digest" ] && [ "$latest_manifest_digest" = "$sha_digest" ] \
            || { echo "registry tags do not resolve to the pushed digest" >&2; exit 1; }
          echo "Published digest: $sha_digest"

      - name: Retain only the current Cloud-Chrome package version
        if: steps.current-main.outputs.current == 'true' && steps.image-inputs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_DIGEST: ${{ steps.publish.outputs.digest }}
          EXPECTED_SHA_TAG: sha-${{ github.sha }}
          API_URL: ${{ github.api_url }}
          PACKAGE_NAME: cloud-chrome
          PACKAGE_OWNER: mosabbir-maruf
        run: bash scripts/ghcr-retain-current.sh

  cleanup-image-artifact:
    name: Clean up workflow image artifact
    runs-on: ubuntu-latest
    needs: [build, runtime, backup, hardening, publish]
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete this run's image artifact, if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          set -euo pipefail
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No cloud-chrome-image artifact was created for this run."
            exit 0
          fi
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "Invalid upload-artifact ID; refusing deletion." >&2; exit 1; }
          gh api --method DELETE "$API_URL/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          echo "Deleted this run's cloud-chrome-image artifact ID $ARTIFACT_ID. This if: always() cleanup is best-effort; GitHub force-cancellation may bypass it."

  publication-status:
    name: GHCR publication status
    runs-on: ubuntu-latest
    needs: [publish]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Report publication outcome
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          if [ "$PUBLISH_RESULT" = skipped ]; then
            echo "GHCR publication skipped: no eligible image-input change or event."
          elif [ "$PUBLISH_RESULT" != success ]; then
            echo "GHCR publication did not complete successfully: $PUBLISH_RESULT" >&2
            exit 1
          else
            echo "GHCR publication and retention job completed successfully."
          fi
